schema_version: 1
verified_on: "2026-07-16"
policy: >-
  Only public repositories appear as records. This registry describes stable
  authority, target naming, lifecycle, synchronization, and release boundaries;
  dynamic branch, commit, worktree, and local availability state remains outside
  the public artifact.
repositories:
  - id: vulca-sdk
    current_owner: vulca-org
    current_name: vulca-visual-control-sdk
    target_name: vulca-visual-control-sdk
    visibility: public
    lane: visual-systems
    lifecycle: active
    disposition: adopt
    canonical_for: [Vulca Python SDK, Vulca CLI, Vulca MCP server, Public SDK documentation]
    sync_direction: >-
      A non-public development source may export selected public-safe changes
      into this repository; this repository is the public distribution source.
    version_source: pyproject.toml
    release_channels: [PyPI, GitHub tags, GitHub Releases]
    release_boundary: Maintainer-approved public SDK releases from the declared version source.
    public_url: https://github.com/vulca-org/vulca-visual-control-sdk
    notes: Canonical public product and developer surface.
  - id: vulca-plugin
    current_owner: vulca-org
    current_name: vulca-visual-agent-plugin
    target_name: vulca-visual-agent-plugin
    visibility: public
    lane: visual-systems
    lifecycle: active
    disposition: adopt
    canonical_for: [Vulca agent plugin distribution]
    sync_direction: >-
      Selected public SDK skills synchronize from the SDK distribution into
      this plugin distribution repository.
    version_source: Plugin manifest
    release_channels: [GitHub repository]
    release_boundary: Maintainer-approved plugin packaging from the declared manifest.
    public_url: https://github.com/vulca-org/vulca-visual-agent-plugin
    notes: Canonical plugin packaging surface; it does not replace the SDK source.
  - id: comfyui-vulca
    current_owner: vulca-org
    current_name: vulca-comfyui-visual-nodes
    target_name: vulca-comfyui-visual-nodes
    visibility: public
    lane: integrations-internal-archive
    lifecycle: active
    disposition: adopt
    canonical_for: [Vulca ComfyUI adapter]
    sync_direction: >-
      Adapter releases consume public Vulca SDK contracts; adapter-specific
      nodes remain authoritative in this repository.
    version_source: Package manifest and Git tags
    release_channels: [GitHub tags, GitHub Releases]
    release_boundary: Maintainer-approved adapter releases through public Git channels.
    public_url: https://github.com/vulca-org/vulca-comfyui-visual-nodes
    notes: Canonical ComfyUI integration surface.
  - id: vulca-nemo-curator-adapter
    current_owner: vulca-org
    current_name: vulca-nemo-curator-adapter
    target_name: vulca-nemo-curator-adapter
    visibility: public
    lane: integrations-internal-archive
    lifecycle: active
    disposition: adopt
    canonical_for: [Public NeMo Curator ImageWriter Parquet adapter and maintainer handoff]
    sync_direction: >-
      A controlled development source exports an exact maintainer-approved
      allowlisted candidate into this public distribution; synchronization is
      one way and public-only edits do not flow back.
    version_source: package_manifest.json and repository revisions
    release_channels: [GitHub repository]
    release_boundary: >-
      Human-confirmed allowlisted source candidates whose provenance, tracked
      file set, content digest, focused tests, and package builds pass CI; the
      complete development source and local run outputs remain excluded.
    public_url: https://github.com/vulca-org/vulca-nemo-curator-adapter
    notes: >-
      Canonical public distribution for the selected source-pinned NeMo Curator
      boundary; it is not the complete Curator adapter development authority.
  - id: vulca-bench
    current_owner: vulca-org
    current_name: vulca-cultural-visual-benchmark
    target_name: vulca-cultural-visual-benchmark
    visibility: public
    lane: research-evaluation
    lifecycle: maintained
    disposition: adopt
    canonical_for: [Public VULCA-Bench metadata releases and evaluation tooling]
    sync_direction: >-
      Controlled research sources export maintainer-approved metadata releases
      into this canonical organization repository; Hugging Face remains a
      separate distribution surface that requires explicit reconciliation.
    version_source: release/v2.1/manifest.json and repository revisions
    release_channels: [GitHub repository]
    release_boundary: >-
      Maintainer-approved metadata-first benchmark releases validated by the
      release manifest and CI; third-party artwork images remain source-specific
      and are not redistributed.
    public_url: https://github.com/vulca-org/vulca-cultural-visual-benchmark
    notes: >-
      Canonical public v2.1 repository; https://github.com/yha9806/VULCA-Bench
      remains the historical personal-owner source and is not the active release
      authority.
  - id: vulca-framework
    current_owner: vulca-org
    current_name: vulca-cultural-evaluation-framework
    target_name: vulca-cultural-evaluation-framework
    visibility: public
    lane: research-evaluation
    lifecycle: maintained
    disposition: adopt
    canonical_for: [Public VULCA cultural evaluation framework research prototype]
    sync_direction: >-
      Consumes canonical VULCA-Bench constructs and public release inputs;
      framework experiments do not redefine benchmark schemas or release scores.
    version_source: pyproject.toml and repository revisions
    release_channels: [GitHub repository]
    release_boundary: >-
      Maintainer-approved public prototype revisions validated by repository CI;
      exact paper reproduction requires separately governed calibration artifacts.
    public_url: https://github.com/vulca-org/vulca-cultural-evaluation-framework
    notes: >-
      Canonical organization repository for the uncalibrated public research
      prototype; it is not the SDK or benchmark release authority.
  - id: emnlp2025-vulca
    current_owner: yha9806
    current_name: EMNLP2025-VULCA
    target_name: null
    visibility: public
    lane: research-evaluation
    lifecycle: deprecated
    disposition: blocked
    canonical_for: [Historical EMNLP 2025 research artifacts]
    sync_direction: none
    version_source: Repository revision
    release_channels: [GitHub repository]
    release_boundary: Historical research traceability only; no current product release authority.
    public_url: https://github.com/yha9806/EMNLP2025-VULCA
    notes: Historical research surface; target naming remains unresolved.
  - id: vulca-emnlp2025-site
    current_owner: yha9806
    current_name: VULCA-EMNLP2025
    target_name: null
    visibility: public
    lane: research-evaluation
    lifecycle: deprecated
    disposition: blocked
    canonical_for: [Historical EMNLP 2025 project website]
    sync_direction: none
    version_source: Repository revision
    release_channels: [GitHub Pages]
    release_boundary: Historical website traceability only; no current product release authority.
    public_url: https://github.com/yha9806/VULCA-EMNLP2025
    notes: Historical website surface; target naming remains unresolved.
  - id: vulca-exhibition
    current_owner: yha9806
    current_name: vulca-exhibition
    target_name: null
    visibility: public
    lane: integrations-internal-archive
    lifecycle: deprecated
    disposition: blocked
    canonical_for: [Historical exhibition implementation]
    sync_direction: Superseded by current public product surfaces; no reverse synchronization is expected.
    version_source: Repository revision
    release_channels: []
    release_boundary: No active release channel; target naming remains unresolved.
    public_url: https://github.com/yha9806/vulca-exhibition
    notes: Migrated historical implementation retained for traceability.
  - id: claude-skills-vulca
    current_owner: yha9806
    current_name: claude-skills-vulca
    target_name: null
    visibility: public
    lane: integrations-internal-archive
    lifecycle: archived
    disposition: archive
    canonical_for: [Historical Vulca skill distribution]
    sync_direction: none
    version_source: Repository revision
    release_channels: []
    release_boundary: Archived with no active release channel.
    public_url: https://github.com/yha9806/claude-skills-vulca
    notes: Archived historical surface; current skills ship through canonical repositories.
