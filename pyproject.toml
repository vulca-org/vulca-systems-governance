[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulca-systems-governance"
version = "0.1.0"
description = "Evidence-governed repository authority and migration control plane for Vulca Systems"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff==0.15.11"]

[project.scripts]
vulca-governance = "vulca_governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulca_governance"]

[tool.ruff]
target-version = "py310"
line-length = 100
